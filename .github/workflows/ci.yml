name: CI
on:
  push: {branches: [main]}
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: read-all
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # coverage badge/data branch (py-cov-action)
      pull-requests: write   # CI summary + coverage comments on PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Documented exception (zizmor artipacked, see .github/zizmor.yml):
          # py-cov-action pushes its coverage-data branch via git on main
          # pushes and needs the persisted token — which this job already
          # holds as contents:write. Every subsequent step is a pinned,
          # audited action.
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --dev
      - name: Start stores (integration tests)
        # Readiness = a real protocol handshake, not a TCP connect:
        # docker-proxy accepts on the published port as soon as the
        # container exists, so `nc -z` reports ready while the server is
        # still starting (observed: every store test failing with
        # ConnectionResetError at the Bolt handshake).
        run: |
          docker compose up -d memgraph redis
          bolt="import neo4j; d = neo4j.GraphDatabase.driver('bolt://localhost:7687'); d.verify_connectivity(); d.close()"
          ping="import redis; redis.Redis.from_url('redis://localhost:6379').ping()"
          for i in $(seq 1 60); do
            uv run python -c "$bolt" 2>/dev/null && uv run python -c "$ping" 2>/dev/null && exit 0
            sleep 1
          done
          echo "stores did not become ready in 60s" >&2
          exit 1
      - id: lint
        name: ruff check
        run: uv run ruff check .
        continue-on-error: true
      - id: format
        name: ruff format
        run: uv run ruff format --check .
        continue-on-error: true
      - id: bandit
        name: bandit
        run: uv run bandit -c pyproject.toml -r src/ -q
        continue-on-error: true
      - id: typecheck
        name: pyright (strict)
        run: uv run pyright
        continue-on-error: true
      - id: promtool
        name: promtool (SLO rules)
        # rules checked AND unit-tested (synthetic series -> alert must
        # fire); runs in the same digest-pinned image compose uses, so
        # the promtool that gates CI is the prometheus that evaluates
        # in the obs profile (D18)
        run: |
          img=prom/prometheus:v3.9.1@sha256:1f0f50f06acaceb0f5670d2c8a658a599affe7b0d8e78b898c1035653849a702
          docker run --rm -v "$PWD/observability/rules:/rules:ro" --entrypoint promtool "$img" check rules /rules/slo.yml /rules/agent_slo.yml /rules/gateway_slo.yml
          docker run --rm -v "$PWD/observability/rules:/rules:ro" --entrypoint promtool "$img" test rules /rules/slo_test.yml
          docker run --rm -v "$PWD/observability/rules:/rules:ro" --entrypoint promtool "$img" test rules /rules/agent_slo_test.yml
          docker run --rm -v "$PWD/observability/rules:/rules:ro" --entrypoint promtool "$img" test rules /rules/gateway_slo_test.yml
        continue-on-error: true
      - id: tests
        name: pytest
        # pipefail is load-bearing: without it the step's exit code is
        # tee's (always 0), pytest failures are swallowed, and the Gate
        # below never fires — a red suite shipped a green check until a
        # reviewer noticed "1 failed" in a passing job. GitHub only adds
        # pipefail when `shell: bash` is EXPLICIT; a bare run step gets
        # `bash -e` without it.
        shell: bash
        run: uv run pytest 2>&1 | tee pytest.out
        env:
          RESGRAPH_REQUIRE_STORES: "1"   # integration tests must run, not skip
        continue-on-error: true
      - id: mutation
        name: grader mutation gate
        # a survivor means a grader can lie while the suite stays green;
        # the driver exits nonzero on any survivor (see EVALS.md,
        # "Grader verification")
        run: uv run python evals/meta/mutate_graders.py
        continue-on-error: true
      - name: Build CI summary
        if: always()
        run: |
          s() { [ "$1" = "success" ] && echo "✅ pass" || echo "❌ fail"; }
          {
            echo "## CI summary"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| ruff check | $(s "${{ steps.lint.outcome }}") |"
            echo "| ruff format | $(s "${{ steps.format.outcome }}") |"
            echo "| bandit | $(s "${{ steps.bandit.outcome }}") |"
            echo "| pyright (strict) | $(s "${{ steps.typecheck.outcome }}") |"
            echo "| promtool | $(s "${{ steps.promtool.outcome }}") |"
            echo "| pytest | $(s "${{ steps.tests.outcome }}") — $(tail -1 pytest.out) |"
            echo "| grader mutation gate | $(s "${{ steps.mutation.outcome }}") |"
          } > ci-summary.md
          cat ci-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment CI summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          path: ci-summary.md
      - name: Coverage comment
        id: coverage_comment
        if: always()
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4  # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Store comment artifact (fork PRs)
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
      - name: Gate
        if: steps.lint.outcome == 'failure' || steps.format.outcome == 'failure' || steps.bandit.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.promtool.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1
