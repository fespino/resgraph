name: CI
on:
  push: {branches: [main]}
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # coverage badge/data branch (py-cov-action)
      pull-requests: write   # CI summary + coverage comments on PRs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
      - run: uv sync --dev
      - id: lint
        name: ruff check
        run: uv run ruff check .
        continue-on-error: true
      - id: format
        name: ruff format
        run: uv run ruff format --check .
        continue-on-error: true
      - id: bandit
        name: bandit
        run: uv run bandit -c pyproject.toml -r src/ -q
        continue-on-error: true
      - id: tests
        name: pytest
        run: uv run pytest 2>&1 | tee pytest.out
        continue-on-error: true
      - name: Build CI summary
        if: always()
        run: |
          s() { [ "$1" = "success" ] && echo "✅ pass" || echo "❌ fail"; }
          {
            echo "## CI summary"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| ruff check | $(s "${{ steps.lint.outcome }}") |"
            echo "| ruff format | $(s "${{ steps.format.outcome }}") |"
            echo "| bandit | $(s "${{ steps.bandit.outcome }}") |"
            echo "| pytest | $(s "${{ steps.tests.outcome }}") — $(tail -1 pytest.out) |"
          } > ci-summary.md
          cat ci-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment CI summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405  # v2
        with:
          path: ci-summary.md
      - name: Coverage comment
        id: coverage_comment
        if: always()
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4  # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Store comment artifact (fork PRs)
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
      - name: Gate
        if: steps.lint.outcome == 'failure' || steps.format.outcome == 'failure' || steps.bandit.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1
