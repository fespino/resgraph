name: eval-gate
# D29b eval gate (SPEC.md). The comparison is free and offline; CI does
# NOT run the paid suite — a ~$4 run per PR does not scale, so the gate
# checks the newest committed run against the baseline and a real
# behavior change ships its own fresh run.
on:
  pull_request:
    # labeled/unlabeled are here so the eval-baseline-refresh override
    # takes effect on the label alone: a re-run replays the original
    # event payload, so without a fresh event the new label is invisible.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "src/resgraph/analyst/**"
      - "src/resgraph/tools/**"
      - "src/resgraph/evals/**"
      - "evals/**"
      # the skill body is loaded straight into the system prompt, so a
      # change here is a behavior change (test_eval_gate_scope.py)
      - "skills/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read         # job-level permissions replace the workflow block
      pull-requests: write   # sticky verdict comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --dev
      - id: gate
        shell: bash
        run: |
          # The CLI selects the newest GATEABLE run from the directory,
          # skipping companion-set runs and naming what it skipped.
          code=0
          uv run resgraph-evals gate evals/runs --md >> gate.out 2>&1 || code=$?
          case "$code" in
            0) verdict=pass ;;
            1) verdict=block ;;
            3) verdict=declined ;;
            *) verdict=error
               echo "the gate could not run (exit $code) — this is a broken gate," >> gate.out
               echo "not an eval regression; the label does not override it." >> gate.out ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          cat gate.out
      - name: Comment gate verdict on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: eval-gate
          path: gate.out
      - name: Enforce
        # eval-baseline-refresh downgrades a block to a report (the PR
        # commits a fresh baseline); fabrications are named in the
        # verdict and stay a reason to withhold the label.
        if: >-
          steps.gate.outputs.verdict == 'block' &&
          !contains(github.event.pull_request.labels.*.name, 'eval-baseline-refresh')
        run: |
          echo "eval gate blocked — see the PR comment. Override only with a" >&2
          echo "reviewed eval-baseline-refresh label committing a fresh baseline." >&2
          exit 1
      - name: Fail on a broken gate
        if: steps.gate.outputs.verdict == 'error'
        run: |
          echo "the eval gate itself failed — see the PR comment." >&2
          exit 1
