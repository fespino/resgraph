name: market-snapshot
# The phase-14 gate (SPEC roadmap amendment) is conditional on accumulated
# catalog churn, which nobody was collecting: the cadence existed as an
# intention and the directory held one file. This is the collection.
#
# D46 rejected polling inside the gateway PROCESS, to keep the serving path
# network-free; a scheduled job outside it is the cadence that decision
# called honest. One request per day, under the connector's own User-Agent.
#
# Snapshots land on the `market-data` branch, not on main: main requires
# four status checks with enforce_admins, so the first scheduled firing was
# rejected (GH006). D46 amended — the direct-commit exception is withdrawn.
on:
  schedule:
    - cron: '0 9 * * *'   # daily 09:00 UTC, after the 06-08:00 security scans
  workflow_dispatch:
permissions: read-all

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # commits to market-data only; main is never written
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Documented exception (zizmor artipacked, .github/zizmor.yml):
          # this checkout commits the snapshot it fetched and needs the token
          # to persist. It holds data only — no code runs from it.
          persist-credentials: true
          ref: market-data
          path: _data
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --dev
      - id: pull
        name: pull the catalog
        # market-pull refuses on shape drift and prints DRIFT lines against
        # the previous snapshot, so an undeclared upstream field is announced
        # on the day it appears rather than at the next manual look. `shell:
        # bash` for pipefail: the default shell would report tee's exit code
        # and a refused pull would read as a green run.
        shell: bash
        run: uv run resgraph-gateway market-pull --out-dir _data/evals/market | tee "$RUNNER_TEMP/pull.log"
      - name: commit the snapshot
        working-directory: _data
        run: |
          if [ -z "$(git status --porcelain evals/market/)" ]; then
            echo "no new snapshot (same day, or the catalog is byte-identical)"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # only ever this directory: the job collects data, never code
          git add evals/market/
          git commit -m "data: market catalog snapshot $(date -u +%F)"
          git push origin market-data
      - name: surface drift in the run summary
        run: |
          {
            echo '## Market catalog pull'
            echo '```'
            cat "$RUNNER_TEMP/pull.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
