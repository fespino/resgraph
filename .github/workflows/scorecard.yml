name: Scorecard

# OpenSSF Scorecard — measures this repo against the industry checklist
# for open-source security posture (branch protection, pinned deps,
# SAST, token permissions, ...) and publishes the result. The README
# badge reads from the published data. Weekly + on main so the score
# tracks reality, not a one-time snapshot.

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '0 8 * * 1'   # Mondays 08:00 UTC, after the 06/07:00 scans
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish results to the OpenSSF API (badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4
        with:
          sarif_file: results.sarif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
