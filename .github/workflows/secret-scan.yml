name: Secret scan

# Scans the repo for accidentally-committed secrets using TruffleHog.
# Runs on every push to main, every pull request, and weekly on Monday
# morning. Fails the build on any verified finding (--only-verified =
# TruffleHog confirmed the credential authenticates against the issuing
# service; eliminates almost all false positives). Documented
# exceptions go in .trufflehogignore at the repo root.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # scheduled-scan failures open a tracking issue

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # TruffleHog needs full git history to scan all commits, not
          # just the working tree.
          fetch-depth: 0

      - name: TruffleHog OSS scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11  # v3.96.0
        with:
          path: ./
          # For PRs, scan only the new commits introduced. For push and
          # schedule events, scan the full history.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'HEAD' }}
          extra_args: --only-verified

      # A failed weekly cron is invisible unless it lands somewhere.
      # Unlike the OSV equivalent, the issue body deliberately contains
      # NO scan output: the finding locates a live credential, and this
      # is a public repo — the issue is an alarm, not a report. Details
      # are in the (also public) run logs; the response is rotate
      # first, ask questions after.
      - name: Open issue on scheduled-scan failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Security: scheduled secret scan found a verified credential"
          gh label create security --color D93F0B --description "Security finding" --force
          EXISTING=$(gh issue list --label security --state open --search "$TITLE" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            printf '**Re-scan on %s** — verified finding still present. [Workflow run](%s)\n' \
              "$(date -u +%Y-%m-%d)" "$RUN_URL" | gh issue comment "$EXISTING" --body-file -
          else
            {
              echo "The weekly TruffleHog sweep found a **verified** credential in git history."
              echo
              echo "**Respond in this order:**"
              echo "1. **Rotate the credential now** — it authenticates; treat it as compromised"
              echo "2. Identify it from the [workflow run]($RUN_URL) logs"
              echo "3. Scrub it from history and force-push, or accept the history if rotated"
              echo "4. Add a documented exception to \`.trufflehogignore\` only if it's a deliberate test fixture"
            } | gh issue create --title "$TITLE" --label security --body-file -
          fi
