name: Workflow security lint

# zizmor statically audits the GitHub Actions workflows themselves —
# unpinned actions, credential persistence, template injection,
# excessive permissions. The CI's supply chain is part of the attack
# surface; this keeps the checks honest about their own security.

on:
  push:
    branches: [main]     # always on main — every mainline commit re-validated
  pull_request:
    paths: ['.github/workflows/**']   # on PRs, only when workflows change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - run: uvx zizmor==1.28.0 --no-progress .github/workflows/
