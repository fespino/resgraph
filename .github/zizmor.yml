# zizmor configuration — documented exceptions only.
rules:
  artipacked:
    # ci.yml's checkout persists credentials deliberately: py-cov-action
    # pushes the coverage-data branch via git on main pushes and fails
    # without them (issue #12). The persisted token is the job's own
    # GITHUB_TOKEN, already contents:write scoped for that branch.
    ignore:
      - ci.yml
      # market-snapshot.yml commits the snapshot it just fetched, so the
      # checkout token must persist. The job's write scope is the whole
      # repo by necessity and its commit step stages evals/market/ only:
      # it collects data and never touches code.
      - market-snapshot.yml
