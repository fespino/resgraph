# Local stores — grows with the platform (Redis Stream, Memgraph, Iceberg, ...)
#
# Images are pinned by DIGEST, same policy as the SHA-pinned GitHub
# Actions: a floating tag means CI and laptops can silently run
# different servers (a `latest` drift was a suspect in a flaky golden
# test before pinning). Dependabot keeps the digests current.
services:
  redis:
    image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    ports: ["6379:6379"]
    # AOF off: the stream is regenerable by seed (D6); durability is not
    # this layer's budget.
    command: ["redis-server", "--appendonly", "no"]
  memgraph:
    # -mage variant: the algorithm library costs nothing locally and
    # later statistical queries may want it. Memory-limited — the store
    # gets a budget like everything else.
    # 3.12.0 (latest as of 2026-08-01). Affected by the BFS
    # deleted-vertex anomaly (#36) — as is 3.11.0; wipe() is the
    # workaround, so no version dodges it.
    image: memgraph/memgraph-mage@sha256:f252561ba38f4c5f530f9d0c7d916f47a37ed20fdfdcfd9b596ca149bd9a5fd8
    ports: ["7687:7687"]
    command: ["--log-level=WARNING", "--memory-limit=2048"]
  prometheus:
    # Observability profile (D17): opt-in so default runs stay lean —
    # the observer must not distort the benchmarks it observes.
    profiles: ["obs"]
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:
    profiles: ["obs"]
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    ports: ["3000:3000"]
    # anonymous admin: a local-only dashboard behind no network boundary;
    # auth here would be theater
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
  postgres:
    # Benchmark-only (profile: bench): the recursive-CTE null hypothesis
    # for the traversal benchmark — "graph beats recursive SQL" is a
    # claim, and claims get measured (D1's reversal condition depends on
    # this comparison). Not started by default:
    #   docker compose --profile bench up -d postgres
    profiles: ["bench"]
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment: {POSTGRES_PASSWORD: resgraph}
    # 5433 on the host: developer machines often run their own postgres
    # on 5432, which wins the localhost race against the container.
    ports: ["5433:5432"]
  ollama:
    # Local worker backend for the eval seam (D29c). Opt-in like obs/bench —
    # heavy, and only the --worker path needs it. Serves the OpenAI-compatible
    # API on 11434; workers.yaml's qwen-local points here.
    #   docker compose --profile local up -d
    profiles: ["local"]
    image: ollama/ollama:0.12.6@sha256:a61a8fd395dbb931cc8cb1b5da7a2510746575c87113fdc45b647ee59ef7f808
    ports: ["11434:11434"]
    volumes: [ollama-models:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
  ollama-pull:
    # One-shot: pull the model qwen-local names, then exit — so bringing the
    # profile up leaves a ready worker instead of a manual pull step.
    profiles: ["local"]
    image: ollama/ollama:0.12.6@sha256:a61a8fd395dbb931cc8cb1b5da7a2510746575c87113fdc45b647ee59ef7f808
    depends_on:
      ollama: {condition: service_healthy}
    environment: {OLLAMA_HOST: "ollama:11434"}
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:7b"]
    restart: "no"

volumes:
  ollama-models:
