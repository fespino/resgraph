# Named client setups for the eval harness (--worker NAME, --judge NAME).
#
# `provider` picks the client. Anthropic has its own (native prompt caching and
# thinking, which the harness relies on); every other provider speaks the OpenAI
# chat-completions API and shares one client, so adding one is a config entry —
# base_url + which env var holds its key — not code. The setup name is the arm
# label and the provenance recorded per row.
#
# Secrets never live here: keys come from the environment. `api_key_env` names
# the variable; never paste the value. Local endpoints usually need no key.

# extra_args are request kwargs merged into the worker's call, so a setup
# carries its own knobs: adaptive thinking for the models that support it,
# and NOTHING for haiku (haiku 4.5 rejects a thinking param). `--worker NAME`
# therefore runs correctly without a matching --thinking at the call site.
opus:
  provider: anthropic
  capabilities:
    tools: true
  model: claude-opus-4-8
  extra_args:
    thinking:
      type: adaptive

sonnet:
  provider: anthropic
  capabilities:
    tools: true
  model: claude-sonnet-4-6
  extra_args:
    thinking:
      type: adaptive

haiku:
  provider: anthropic
  capabilities:
    tools: true
  model: claude-haiku-4-5

# A hosted chat-completions provider — OpenAI, OpenRouter, a cloud endpoint.
openai:
  provider: openai
  capabilities:
    tools: true
  model: gpt-4o
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY

# An alias MAY declare `endpoints:` — one model, many serving locations —
# and the gateway selects among them per request (health, then latency);
# a pin must then name one (`alias@name`): serving location is part of
# what a measured run pins, since quantization can differ per endpoint.
# Each entry merges over the alias's own keys. Example (not active — this
# host runs one serving stack):
#
#   qwen-local-1.5b:
#     model: qwen2.5:1.5b
#     context_window: 8192
#     endpoints:
#       - name: ollama
#         provider: ollama
#         base_url: http://localhost:11434/v1
#         quant: Q4_K_M
#       - name: llamacpp
#         provider: llamacpp
#         base_url: http://localhost:8081/v1
#         quant: Q8_0
#         # optional per-endpoint price (input+output rates per mtok);
#         # overrides the wire model's pricing-table entry — the same
#         # weights can price differently per serving location. Unpriced
#         # endpoints are the free tier and preempt the price lottery.
#         price_per_mtok: {input: 0.5, output: 1.5}

# A self-hosted model, on localhost or a remote GPU — same client, only the URL
# changes. tool_choice: required forces a tool call (the constrained-decoding
# lever); add extra_args (e.g. guided_json) if the model emits malformed calls.
# One entry per size so the arm label names the model. The size is a RAM ladder:
# 7b (~5 GiB) needs a ≥16 GB host; 1.5b fits a tight box but is a seam smoke
# worker, not a credible analyst — it fabricates, and the fabrication guards fire
# on it (#192). Only 1.5b has been run end to end here; 3b/7b await the hardware.
qwen-local-7b:
  provider: ollama
  capabilities:
    tools: true
  model: qwen2.5:7b
  base_url: http://localhost:11434/v1
  temperature: 0
  seed: 7
  quant: Q4_K_M
  context_window: 8192
  tool_choice: required

qwen-local-3b:
  provider: ollama
  capabilities:
    tools: true
  model: qwen2.5:3b
  base_url: http://localhost:11434/v1
  temperature: 0
  seed: 7
  quant: Q4_K_M
  context_window: 8192
  tool_choice: required

qwen-local-1.5b:
  provider: ollama
  capabilities:
    tools: true
  model: qwen2.5:1.5b
  base_url: http://localhost:11434/v1
  temperature: 0
  seed: 7
  quant: Q4_K_M
  context_window: 8192
  tool_choice: required
  # probing is opt-in per setup; a local server can 200 its health
  # endpoint while generation has collapsed, so this one is probed
  probe_interval_s: 60

# Through the gateway: the seam's client POSTs /v1/generate and the
# gateway's registry resolves the serving model. Routing belongs to the
# setup (pin / task_class), not the caller; a measured run pins and
# disables the response cache — the instrument bypass. A pinned setup
# declares the wire model it pins so rows price correctly.
haiku-via-gateway:
  provider: gateway
  base_url: http://localhost:8080
  pin: haiku
  model: claude-haiku-4-5
  cache_responses: false

# The replay-measurement setup: the response cache stays ON, which is the
# point — this setup exists to measure the gateway cache layer on replayed
# real traffic and is never a measured-run arm (a measured run pins with
# the cache bypassed, like haiku-via-gateway above).
qwen-replay-gateway:
  provider: gateway
  base_url: http://localhost:8080
  pin: qwen-local-1.5b
  model: qwen2.5:1.5b

# An endpoint MAY declare its lifecycle (ISO dates). Deprecated serves
# with a logged warning; past sunset it refuses 410 — never a silent
# remap: pins are the platform's thesis, and a retired name keeps its
# meaning instead of quietly becoming a different model.
# `resgraph-gateway lifecycle --today 2026-12-01` answers what breaks.
#
#   some-alias:
#     ...
#     lifecycle:
#       deprecated: "2026-09-01"
#       sunset: "2026-12-01"
