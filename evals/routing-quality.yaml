# The quality table: per-task-class scores the router consumes as a
# third axis beside price and latency. Generated from eval runs by
# `resgraph-evals routing-table` — never hand-written: every entry
# carries the run file and date it came from, and the loader refuses
# entries without that provenance. A task class whose registry route
# declares candidates + a min_passk floor routes among the measured
# aliases that clear the floor (unmeasured = ineligible: no eval, no
# route), weighted by measured cost per passed triage.
#
# The fields are ROUTING_INPUTS in resgraph.evals.arms (D52). An entry
# generated before a required field existed no longer loads: regenerate
# it, never hand-add the field.
#
# No multi-arm run files are committed yet, so no scores are either;
# the schema, once `resgraph-evals routing-table` generates it:
#
# scores:
#   judgment:
#     haiku:
#       passk: 0.78
#       cost_per_passed: 0.085
#       latency_p50_s: 39.5
#       latency_p95_s: 61.2
#       fabrication_count: 0      # nonzero disqualifies, floor or no floor
#       workers: [claude-haiku-4-5]
#       run: evals/runs/<file>.jsonl
#       date: "2026-08-19"
