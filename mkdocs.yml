# Built with ProperDocs (MkDocs 1.x continuation); the legacy config
# filename is kept because the content is meant to stay portable across
# the whole MkDocs lineage. Build: uv run properdocs build --strict -f mkdocs.yml
site_name: f.espino / resgraph
site_url: https://fespino.github.io/resgraph/
site_description: >-
  A mini data platform built for learning: streaming graph hot store,
  Iceberg cold store, an investigating agent with its eval harness, and a
  serving gateway — every number with hardware and methodology.
repo_url: https://github.com/fespino/resgraph

theme:
  name: null
  custom_dir: site_theme
  static_templates:
    - 404.html

hooks:
  - tools/site_hooks.py

markdown_extensions:
  - toc:
      permalink: false
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.highlight:
      anchor_linenums: false
      guess_lang: false
      use_pygments: true
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Devlog: writing/index.md
  - Engineering:
      - Security posture: security-posture.md
      - Stream contract: stream-contract.md
      - Planner vocabulary: planner-vocabulary.md
      - Capacity: capacity.md
      - Prompt audit: prompt-audit.md
      - Evals compaction runbook: evals-compaction-runbook.md
  - Drills:
      - Runbook: drills/README.md
      - Premortem template: drills/premortem-template.md
      - Postmortem template: drills/postmortem-template.md
  - Sentinel:
      - Threat model: sentinel/threat-model.md
      - Detection economics: sentinel/detection-economics.md
      - Corpus: sentinel/corpus.md
      - Prior art: sentinel/prior-art.md
  - Incidents:
      - INC-001 hot-store loss: incidents/INC-001-hotstore-loss.md
      - INC-002 degraded drill misfire: incidents/INC-002-degraded-drill-misfire.md
      - INC-003 analyst degraded cold: incidents/INC-003-analyst-degraded-cold.md
      - INC-004 gateway failover: incidents/INC-004-gateway-failover.md
