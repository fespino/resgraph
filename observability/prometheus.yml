# Scrape config (D17). 5s interval: laptop runs are short; coarse
# scraping would alias the very spikes the drill induces.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: resgraph-api
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: resgraph-workers
    static_configs:
      # up to four local ingest workers; absent targets just stay down
      - targets:
          - host.docker.internal:9101
          - host.docker.internal:9102
          - host.docker.internal:9103
          - host.docker.internal:9104
