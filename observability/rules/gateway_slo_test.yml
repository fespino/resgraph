# promtool unit tests for the gateway SLO rules — synthetic series prove
# the two baseline-free alerts fire under breach and stay quiet when
# healthy, and the availability ratio counts explicit failure as available.
rule_files:
  - gateway_slo.yml

evaluation_interval: 15s

tests:
  # Multi-hop chains present: rate over the >1.0 bucket is nonzero.
  - interval: 15s
    input_series:
      - series: 'gateway_fallback_chain_length_bucket{le="1.0"}'
        values: "0+5x40"
      - series: 'gateway_fallback_chain_length_bucket{le="+Inf"}'
        values: "0+7x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: GatewayDegradedChains
        exp_alerts:
          - exp_labels:
              slo: gateway-degraded
            exp_annotations:
              summary: >-
                Gateway fallback chains longer than one hop: the system is
                degrading through multiple backends per request.

  # Single-hop only: every chain within the le="1.0" bucket — quiet.
  - interval: 15s
    input_series:
      - series: 'gateway_fallback_chain_length_bucket{le="1.0"}'
        values: "0+7x40"
      - series: 'gateway_fallback_chain_length_bucket{le="+Inf"}'
        values: "0+7x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: GatewayDegradedChains
        exp_alerts: []

  # Queue pressure: depth pinned at the local bound for 2m.
  - interval: 15s
    input_series:
      - series: 'gateway_queue_depth{backend="ollama"}'
        values: "4x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: GatewayQueuePressure
        exp_alerts:
          - exp_labels:
              slo: gateway-queue
              backend: ollama
            exp_annotations:
              summary: >-
                Gateway queue depth at or above the local bound — the leading
                pressure signal; latency follows if this holds.

  # Availability: explicit failures (429, stream_error, the eager 503)
  # still count as available; the ratio stays 1.0.
  - interval: 15s
    input_series:
      - series: 'gateway_requests_total{outcome="ok"}'
        values: "0+6x40"
      - series: 'gateway_requests_total{outcome="rejected_429"}'
        values: "0+2x40"
      - series: 'gateway_requests_total{outcome="stream_error"}'
        values: "0+2x40"
      - series: 'gateway_requests_total{outcome="refused_503"}'
        values: "0+2x40"
      - series: 'gateway_requests_total{outcome="budget_503"}'
        values: "0+2x40"
    promql_expr_test:
      - expr: slo:gateway_availability:ratio_5m
        eval_time: 8m
        exp_samples:
          - labels: "slo:gateway_availability:ratio_5m"
            value: 1.0
