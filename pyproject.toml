[project]
name = "resgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Fran Espino", email = "fespinoromero@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.120.2",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "mcp>=2.0.0",
    "neo4j>=6.2.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-prometheus>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pyiceberg[pyiceberg-core,sql-sqlite]>=0.11.1",
    "pyyaml>=6.0.3",
    "redis>=8.0.1",
    "typer>=0.27.1",
    "uvicorn>=0.52.3",
]

[project.scripts]
resgraph = "resgraph.cli:app"
resgraph-analyst = "resgraph.analyst.cli:app"
resgraph-evals = "resgraph.evals.cli:app"
resgraph-gateway = "resgraph.gateway.cli:app"
resgraph-gen = "resgraph.gen.cli:app"
resgraph-mcp = "resgraph.mcp.server:main"
resgraph-sentinel = "resgraph.sentinel.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B311: random.Random is the point — the generator's determinism
# contract (D6) requires a seeded PRNG; nothing here is cryptographic.
skips = ["B311"]

[tool.coverage.run]
relative_files = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=resgraph --cov-report=term-missing"
testpaths = ["tests"]
# --strict-markers: an unregistered/typo'd marker fails, so an external
# test can't silently ship unmarked. Unit-only run: pytest -m "not integration"
markers = ["integration: requires docker compose stores (memgraph)"]

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "httpx>=0.28.1",
    "hypothesis>=6.165.2",
    "psycopg[binary]>=3.3.4",
    "pyarrow-stubs>=20.0.0.20260625",
    "pyright[nodejs]>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src"]
# The reportUnknown* family is off: it measures third-party stub quality
# (neo4j, pyiceberg, duckdb, redis all ship partial or no types) and at
# error level it buries our own defects under ~700 cascade diagnostics.
# Reversal: re-enable per rule as those stubs complete. Everything else
# stays at strict defaults; per-module downgrades require a reason here.
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
