[project]
name = "resgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Fran Espino", email = "fespinoromero@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "redis>=8.0.1",
    "typer>=0.27.0",
]

[project.scripts]
resgraph = "resgraph:main"
resgraph-gen = "resgraph.gen.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B311: random.Random is the point — the generator's determinism
# contract (D6) requires a seeded PRNG; nothing here is cryptographic.
skips = ["B311"]

[tool.coverage.run]
relative_files = true

[tool.pytest.ini_options]
addopts = "-q --cov=resgraph --cov-report=term-missing"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "hypothesis>=6.161.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
